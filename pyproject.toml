[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptas"
version = "1.0.7"
description = "An optimization-based task specification library for task and motion planning (TAMP), trajectory optimization, and model predictive control."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Christopher E. Mower", email = "christopher.mower@kcl.ac.uk" }]
maintainers = [{ name = "João Moura", email = "joao.moura@ed.ac.uk" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy",
  "scipy",
  "casadi",
  "urdf-parser-py",
  "osqp",
  "cvxopt",
  "xacro",
  "vtk",
  "pyyaml",
]

[project.optional-dependencies]
example = ["pybullet", "matplotlib"]
test = ["roboticstoolbox-python", "pybullet", "pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/joaomoura24/optas"
Documentation = "https://joaomoura24.github.io/optas/"
Issues = "https://github.com/joaomoura24/optas/issues"
Source = "https://github.com/joaomoura24/optas"

[tool.setuptools]
packages = ["optas"]
