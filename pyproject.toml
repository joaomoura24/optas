[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptas"
version = "1.0.7"
description = "A light layer over CasADi for robot optimization: URDF kinematics, inverse kinematics, trajectory optimization and model predictive control."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Christopher E. Mower", email = "christopher.mower@kcl.ac.uk" }]
maintainers = [{ name = "João Moura", email = "joao.moura@ed.ac.uk" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
# Floors: first releases with Python 3.12 wheels, tested in a venv pinned to them
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.2",
  "casadi>=3.6.4",
  "urdf-parser-py",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
vis = ["viser>=1.1", "trimesh>=4.4"]
xacro = ["xacro"]
all = ["pyoptas[vis,xacro]"]
example = ["pyoptas[all]", "pybullet", "matplotlib"]
test = ["pyoptas[all]", "roboticstoolbox-python", "pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/joaomoura24/optas"
Documentation = "https://joaomoura24.github.io/optas/"
Issues = "https://github.com/joaomoura24/optas/issues"
Source = "https://github.com/joaomoura24/optas"

[tool.setuptools]
packages = ["optas"]
